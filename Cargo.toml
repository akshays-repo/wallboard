[package]
name = "wallboard"
version = "0.1.0"
edition = "2021"

[dependencies]
dirs = "7.0.0"
fontdue = "0.9.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smithay-client-toolkit = "0.21"
tiny-skia = "0.12.0"
wayland-client = "0.31"

[profile.release]
# Measured: 1080p wallpaper decode+scale takes 66 ms at opt-level 3 versus 148 ms at "s", for a
# binary only ~5% bigger (1.75 vs 1.67 MB). RAM use is the same either way.
opt-level = 3
lto = true
codegen-units = 1
strip = true
# A panic ends the process; no unwinding tables, and niri's spawn-at-startup / systemd restarts it.
panic = "abort"
